name: devsecops

on:
  push:
    branches: [main]

jobs:
 #------------CI-----------------------------------
  code_quality:
   uses: ./.github/workflows/code_quality.yml

  Secrets_Scanning:
   uses: ./.github/workflows/secrets_scanning.yml

  dependency_check:
   uses: ./.github/workflows/dependency_check.yml 

  docker_scan:
    uses: ./.github/workflows/docker_scan.yml 
    secrets: inherit

  sonar_scan:
    uses: ./.github/workflows/sonar_scan.yml 
    secrets: inherit