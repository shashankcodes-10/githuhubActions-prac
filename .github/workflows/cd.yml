#goal : deploy the images from ci 

name: CD 

on:
  workflow_call:


jobs:
  deploy:
    runs-on: self-hosted
    steps:
     - name: Code checkout
       uses: actions/checkout@v7  

     - name: env file
       run: cp .env.example .env

     - name: Docker login
       uses: docker/login-action@v4
       with: 
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

     - name: deployment   
       run:
          docker compose pull
          docker compose up -d 